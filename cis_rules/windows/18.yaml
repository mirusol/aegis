metadata:
  os: windows
  section: '18'
rules:
- id: 18.1.1.1
  title: Ensure Prevent enabling lock screen camera is set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Personalization
    name: NoLockScreenCamera
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Personalization'
      /v NoLockScreenCamera /t REG_DWORD /d 1 /f
- id: 18.1.1.2
  title: Ensure Prevent enabling lock screen slide show is set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Personalization
    name: NoLockScreenSlideshow
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Personalization'
      /v NoLockScreenSlideshow /t REG_DWORD /d 1 /f
- id: 18.1.2.2
  title: Ensure Allow users to enable online speech recognition services is set to
    Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\InputPersonalization
    name: AllowInputPersonalization
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\InputPersonalization' /v
      AllowInputPersonalization /t REG_DWORD /d 0 /f
- id: 18.1.3
  title: Ensure Allow Online Tips is set to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: AllowOnlineTips
    value: 0
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      /v AllowOnlineTips /t REG_DWORD /d 0 /f
- id: 18.4.1
  title: Ensure Apply UAC restrictions to local accounts on network logons is set
    to Enabled.
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows\Currentversion\Policies\System
    name: LocalAccountTokenFilterPolicy
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows\Currentversion\Policies\System'
      /v LocalAccountTokenFilterPolicy /t REG_DWORD /d 0 /f
- id: 18.4.2
  title: 18.4.2
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SYSTEM\CurrentControlSet\Control\Print
    name: RpcAuthnLevelPrivacyEnabled
    value: 1
  remediation:
    powershell: reg add 'HKLM\SYSTEM\CurrentControlSet\Control\Print' /v RpcAuthnLevelPrivacyEnabled
      /t REG_DWORD /d 1 /f
- id: 18.4.3
  title: Ensure Configure SMB v1 client driver is set to Enabled Disable driver recommended
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10
    name: Start
    value: 4
  remediation:
    powershell: reg add 'HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10' /v Start
      /t REG_DWORD /d 4 /f
- id: 18.4.4
  title: Ensure Configure SMB v1 server is set to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: SMB1
    value: 0
  remediation:
    powershell: reg add 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      /v SMB1 /t REG_DWORD /d 0 /f
- id: 18.4.5
  title: Ensure 'Enable Certificate Padding' is set to 'Enabled'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Microsoft\Cryptography\Wintrust\Config
    name: EnableCertPaddingCheck
    value: 1
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Microsoft\Cryptography\Wintrust\Config' /v
      EnableCertPaddingCheck /t REG_DWORD /d 1 /f
- id: 18.4.6
  title: Ensure Enable Structured Exception Handling Overwrite Protection SEHOP is
    set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel
    name: DisableExceptionChainValidation
    value: 0
  remediation:
    powershell: reg add 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
      /v DisableExceptionChainValidation /t REG_DWORD /d 0 /f
- id: 18.5.1
  title: Ensure MSS AutoAdminLogon Enable Automatic Logon not recommended is set to
    Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows Nt\CurrentVersion\Winlogon
    name: AutoAdminLogon
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows Nt\CurrentVersion\Winlogon'
      /v AutoAdminLogon /t REG_DWORD /d 0 /f
- id: 18.5.7
  title: Ensure MSS NoNameReleaseOnDemand Allow the computer to ignore NetBIOS name
    release requests except from WINS servers is set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Netbt\Parameters
    name: NoNameReleaseOnDemand
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Netbt\Parameters'
      /v NoNameReleaseOnDemand /t REG_DWORD /d 1 /f
- id: 18.5.8
  title: 'Ensure ''MSS: (PerformRouterDiscovery) Allow IRDP to detect and configure
    Default Gateway addresses'' is set to ''Disabled'''
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Tcpip\Parameters
    name: PerformRouterDiscovery
    value: 0
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Tcpip\Parameters'
      /v PerformRouterDiscovery /t REG_DWORD /d 0 /f
- id: 18.5.9
  title: Ensure MSS SafeDllSearchMode Enable Safe DLL search mode recommended is set
    to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Control\Session Manager
    name: SafeDllSearchMode
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Control\Session Manager' /v
      SafeDllSearchMode /t REG_DWORD /d 1 /f
- id: 18.5.10
  title: Ensure MSS ScreenSaverGracePeriod The time in seconds before the screen saver
    grace period expires 0 recommended is set to Enabled 5 or fewer seconds
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon
    name: ScreenSaverGracePeriod
    value: 5
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon'
      /v ScreenSaverGracePeriod /t REG_SZ /d 5 /f
- id: 18.5.11
  title: Ensure MSS TcpMaxDataRetransmissions IPv6 How many times unacknowledged data
    is retransmitted is set to Enabled 3
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Tcpip6\Parameters
    name: TcpMaxDataRetransmissions
    value: 3
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Tcpip6\Parameters'
      /v TcpMaxDataRetransmissions /t REG_DWORD /d 3 /f
- id: 18.5.12
  title: Ensure MSS TcpMaxDataRetransmissions How many times unacknowledged data is
    retransmitted is set to Enabled 3
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Tcpip\Parameters
    name: TcpMaxDataRetransmissions
    value: 3
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Tcpip\Parameters'
      /v TcpMaxDataRetransmissions /t REG_DWORD /d 3 /f
- id: 18.5.13
  title: Ensure MSS WarningLevel Percentage threshold for the security event log at
    which the system will generate a warning is set to Enabled 90 or less
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Eventlog\Security
    name: WarningLevel
    value: 90
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Eventlog\Security'
      /v WarningLevel /t REG_DWORD /d 90 /f
- id: 18.6.4.1
  title: 'Ensure Configure DNS over HTTPS (DoH) name resolution is set to Enabled:
    Allow DoH or higher.'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
    name: DoHPolicy
    value: 2
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' /v
      DoHPolicy /t REG_DWORD /d 2 /f
- id: 18.6.4.2
  title: 'Ensure ''Configure NetBIOS settings'' is set to ''Enabled: Disable NetBIOS
    name resolution on public networks''.'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
    name: EnableNetbios
    value: 2
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' /v
      EnableNetbios /t REG_DWORD /d 2 /f
- id: 18.6.4.3
  title: Ensure Turn off multicast name resolution is set to Enabled.
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\DNSClient
    name: EnableMulticast
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\DNSClient' /v
      EnableMulticast /t REG_DWORD /d 0 /f
- id: 18.6.5.1
  title: Ensure Enable Font Providers is set to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\Windows\System
    name: EnableFontProviders
    value: 0
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System' /v EnableFontProviders
      /t REG_DWORD /d 0 /f
- id: 18.6.8.1
  title: Ensure Enable insecure guest logons is set to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Lanmanworkstation
    name: AllowInsecureGuestAuth
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Lanmanworkstation'
      /v AllowInsecureGuestAuth /t REG_DWORD /d 0 /f
- id: 18.6.9.1
  title: Ensure Turn on Mapper IO LLTDIO driver is set to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Lltd
    name: AllowLLTDIOOndomain
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Lltd' /v AllowLLTDIOOndomain
      /t REG_DWORD /d 0 /f
- id: 18.6.9.2
  title: Ensure Turn on Responder RSPNDR driver is set to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Lltd
    name: AllowRspndrOnDomain
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Lltd' /v AllowRspndrOnDomain
      /t REG_DWORD /d 0 /f
- id: 18.6.10.2
  title: Ensure Turn off Microsoft Peer-to-Peer Networking Services is set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Peernet
    name: Disabled
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Peernet' /v Disabled /t
      REG_DWORD /d 1 /f
- id: 18.6.11.2
  title: Ensure Prohibit installation and configuration of Network Bridge on your
    DNS domain network is set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Network Connections
    name: NC_AllowNetBridge_NLA
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Network Connections'
      /v NC_AllowNetBridge_NLA /t REG_DWORD /d 0 /f
- id: 18.6.11.3
  title: Ensure Prohibit use of Internet Connection Sharing on your DNS domain network
    is set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections
    name: NC_ShowSharedAccessUI
    value: 0
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      /v NC_ShowSharedAccessUI /t REG_DWORD /d 0 /f
- id: 18.6.11.4
  title: Ensure Require domain users to elevate when setting a networks location is
    set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Network Connections
    name: NC_StdDomainUserSetLocation
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Network Connections'
      /v NC_StdDomainUserSetLocation /t REG_DWORD /d 1 /f
- id: 18.6.19.2.1
  title: Disable IPv6 Ensure TCPIP6 Parameter DisabledComponents is set to 0xff 255
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\CurrentControlSet\Services\TCPIP6\Parameters
    name: DisabledComponents
    value: 255
  remediation:
    powershell: reg add 'HKLM\System\CurrentControlSet\Services\TCPIP6\Parameters'
      /v DisabledComponents /t REG_DWORD /d 255 /f
- id: 18.6.20.1
  title: Ensure Configuration of wireless settings using Windows Connect Now is set
    to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Wcn\Registrars
    name: EnableRegistrars
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Wcn\Registrars'
      /v EnableRegistrars /t REG_DWORD /d 0 /f
- id: 18.6.20.2
  title: Ensure Prohibit access of the Windows Connect Now wizards is set to Enabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Wcn\Ui
    name: DisableWcnUi
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Wcn\Ui' /v DisableWcnUi
      /t REG_DWORD /d 1 /f
- id: 18.6.21.1
  title: 'Ensure ''Minimize the number of simultaneous connections to the Internet
    or a Windows Domain'' is set to ''Enabled: 3 = Prevent Wi-Fi when on Ethernet'''
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy
    name: fMinimizeConnections
    value: 3
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy'
      /v fMinimizeConnections /t REG_DWORD /d 3 /f
- id: 18.6.21.2
  title: Ensure 'Prohibit connection to non-domain networks when connected to domain
    authenticated network' is set to 'Enabled'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy
    name: fBlockNonDomain
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy'
      /v fBlockNonDomain /t REG_DWORD /d 1 /f
- id: 18.6.23.2.1
  title: Ensure 'Allow Windows to automatically connect to suggested open hotspots,
    to networks shared by contacts, and to hotspots offering paid services' is set
    to 'Disabled'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Microsoft\WcmSvc\wifinetworkmanager\config
    name: AutoConnectAllowedOEM
    value: 0
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Microsoft\WcmSvc\wifinetworkmanager\config'
      /v AutoConnectAllowedOEM /t REG_DWORD /d 0 /f
- id: 18.7.1
  title: Ensure Allow Print Spooler to accept client connections is set to Disabled
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\Printers
    name: RegisterSpoolerRemoteRpcEndPoint
    value: 2
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\Printers' /v
      RegisterSpoolerRemoteRpcEndPoint /t REG_DWORD /d 2 /f
- id: 18.7.2
  title: 'Ensure ''Configure Redirection Guard'' is set to ''Enabled: Redirection
    Guard Enabled'''
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\Printers
    name: RedirectionguardPolicy
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\Printers' /v
      RedirectionguardPolicy /t REG_DWORD /d 1 /f
- id: 18.7.3
  title: 'Ensure ''Configure RPC connection settings: Protocol to use for outgoing
    RPC connections'' is set to ''Enabled: RPC over TCP''.'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC
    name: RpcUseNamedPipeProtocol
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC'
      /v RpcUseNamedPipeProtocol /t REG_DWORD /d 0 /f
- id: 18.7.4
  title: 'Ensure ''Configure RPC connection settings: Use authentication for outgoing
    RPC connections'' is set to ''Enabled: Default''.'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC
    name: RpcAuthentication
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC'
      /v RpcAuthentication /t REG_DWORD /d 0 /f
- id: 18.7.5
  title: 'Ensure ''Configure RPC listener settings: Protocols to allow for incoming
    RPC connections'' is set to ''Enabled: RPC over TCP''.'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC
    name: RpcProtocols
    value: 5
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC'
