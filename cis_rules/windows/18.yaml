- id: 18.7.6
  title: 'Ensure ''Configure RPC listener settings: Authentication protocol to use
    for incoming RPC connections:'' is set to ''Enabled: Negotiate'' or higher.'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC
    name: ForceKerberosForRpc
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC'
      /v ForceKerberosForRpc /t REG_DWORD /d 0 /f
- id: 18.7.7
  title: 'Ensure ''Configure RPC over TCP port'' is set to ''Enabled: 0''.'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC
    name: RpcTcpPort
    value: 0
  remediation:
    powershell: reg add 'HKLM\Software\Policies\Microsoft\Windows NT\Printers\RPC'
      /v RpcTcpPort /t REG_DWORD /d 0 /f
- id: 18.7.8
  title: Ensure 'Limits print driver installation to Administrators' is set to 'Enabled'
  section: '18'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint
    name: RestrictDriverInstallationToAdministrators
    value: 1
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
