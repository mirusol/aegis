metadata:
  os: windows
  section: '19'
rules:
- id: 19.5.1.1
  title: Ensure Turn off toast notifications on the lock screen is set to Enabled
  section: '19'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKU\{{ item }}\Software\Policies\Microsoft\Windows\Currentversion\Pushnotifications
    name: NoToastApplicationNotificationOnLockScreen
    value: 1
  remediation:
    powershell: reg add 'HKU\{{ item }}\Software\Policies\Microsoft\Windows\Currentversion\Pushnotifications'
      /v NoToastApplicationNotificationOnLockScreen /t REG_DWORD /d 1 /f
- id: 19.6.6.1.1
  title: Ensure Turn off Help Experience Improvement Program is set to Enabled
  section: '19'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKU\{{ item }}\Software\Policies\Microsoft\Assistance\Client\1.0
    name: NoImplicitFeedback
    value: 1
  remediation:
    powershell: reg add 'HKU\{{ item }}\Software\Policies\Microsoft\Assistance\Client\1.0'
      /v NoImplicitFeedback /t REG_DWORD /d 1 /f
- id: 19.7.5.1
  title: Ensure Do not preserve zone information in file attachments is set to Disabled
  section: '19'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKU\{{ item }}\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments
    name: SaveZoneInformation
    value: 2
  remediation:
    powershell: reg add 'HKU\{{ item }}\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments'
      /v SaveZoneInformation /t REG_DWORD /d 2 /f
- id: 19.7.5.2
  title: Ensure Notify antivirus programs when opening attachments is set to Enabled
  section: '19'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKU\{{ item }}\Software\Microsoft\Windows\Currentversion\Policies\Attachments
    name: ScanWithAntiVirus
    value: 3
  remediation:
    powershell: reg add 'HKU\{{ item }}\Software\Microsoft\Windows\Currentversion\Policies\Attachments'
      /v ScanWithAntiVirus /t REG_DWORD /d 3 /f
- id: 19.7.8.1
