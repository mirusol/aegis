metadata:
  os: windows
  section: '9'
rules:
- id: 9.1.2
  title: 'Ensure ''Windows Firewall: Domain: Inbound connections'' is set to ''Block
    (default)'''
  section: '9'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
    name: DefaultInboundAction
    value: 1
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
      /v DefaultInboundAction /t REG_DWORD /d 1 /f
- id: 9.1.3
  title: 'Ensure ''Windows Firewall: Domain: Settings: Display a notification'' is
    set to ''No'''
  section: '9'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
    name: DisableNotifications
    value: 1
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
      /v DisableNotifications /t REG_DWORD /d 1 /f
- id: 9.1.4
  title: 'Ensure ''Windows Firewall: Domain: Logging: Name'' is set to ''%SystemRoot%/System32/logfiles/firewall/domainfw.log'''
  section: '9'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging
    name: LogFilePath
    value: '%SystemRoot%\System32\logfiles\firewall\domainfw.log'
  remediation:
    powershell: reg add 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging'
      /v LogFilePath /t REG_SZ /d %SystemRoot%\System32\logfiles\firewall\domainfw.log
      /f
