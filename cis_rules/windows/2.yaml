metadata:
  os: windows
  section: '2'
rules:
- id: 2.3.1.3
  title: Ensure Accounts Limit local account use of blank passwords to console logon
    only is set to Enabled.
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Control\Lsa
    name: LimitBlankPasswordUse
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Control\Lsa' /v LimitBlankPasswordUse
      /t REG_DWORD /d 1 /f
- id: 2.3.2.1
  title: Ensure Audit Force audit policy subcategory settings Windows Vista or later
    to override audit policy category settings is set to Enabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\CurrentControlSet\Control\Lsa
    name: SCENoApplyLegacyAuditPolicy
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\CurrentControlSet\Control\Lsa' /v SCENoApplyLegacyAuditPolicy
      /t REG_DWORD /d 1 /f
- id: 2.3.2.2
  title: Ensure Audit Shut down system immediately if unable to log security audits
    is set to Disabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\CurrentControlSet\Control\Lsa
    name: CrashOnAuditFail
    value: 0
  remediation:
    powershell: reg add 'HKLM\System\CurrentControlSet\Control\Lsa' /v CrashOnAuditFail
      /t REG_DWORD /d 0 /f
- id: 2.3.4.1
  title: Ensure Devices Prevent users from installing printer drivers is set to Enabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Control\Print\Providers\Lanman Print Services\Servers
    name: AddPrinterDrivers
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Control\Print\Providers\Lanman
      Print Services\Servers' /v AddPrinterDrivers /t REG_DWORD /d 1 /f
- id: 2.3.6.1
  title: Ensure Domain member Digitally encrypt or sign secure channel data always
    is set to Enabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Netlogon\Parameters
    name: RequireSignOrSeal
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Netlogon\Parameters'
      /v RequireSignOrSeal /t REG_DWORD /d 1 /f
- id: 2.3.6.2
  title: Ensure Domain member Digitally encrypt secure channel data when possible
    is set to Enabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Netlogon\Parameters
    name: SealSecureChannel
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Netlogon\Parameters'
      /v SealSecureChannel /t REG_DWORD /d 1 /f
- id: 2.3.6.3
  title: Ensure Domain member Digitally sign secure channel data when possible is
    set to Enabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Netlogon\Parameters
    name: SignSecureChannel
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Netlogon\Parameters'
      /v SignSecureChannel /t REG_DWORD /d 1 /f
- id: 2.3.6.4
  title: Ensure Domain member Disable machine account password changes is set to Disabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Netlogon\Parameters
    name: DisablePasswordChange
    value: 0
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Netlogon\Parameters'
      /v DisablePasswordChange /t REG_DWORD /d 0 /f
- id: 2.3.6.5
  title: Ensure Domain member Maximum machine account password age is set to 30 or
    fewer days but not 0.
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Netlogon\Parameters
    name: MaximumPasswordAge
    value: 30
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Netlogon\Parameters'
      /v MaximumPasswordAge /t REG_DWORD /d 30 /f
- id: 2.3.6.6
  title: Ensure Domain member Require strong Windows 2000 or later session key is
    set to Enabled
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\System\Currentcontrolset\Services\Netlogon\Parameters
    name: RequireStrongKey
    value: 1
  remediation:
    powershell: reg add 'HKLM\System\Currentcontrolset\Services\Netlogon\Parameters'
      /v RequireStrongKey /t REG_DWORD /d 1 /f
- id: 2.3.7.2
  title: Ensure Interactive logon Dont display last signed-in is set to Enabled.
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows\Currentversion\Policies\System
    name: DontDisplayLastUserName
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows\Currentversion\Policies\System'
      /v DontDisplayLastUserName /t REG_DWORD /d 1 /f
- id: 2.3.7.3
  title: 'Ensure Interactive logon: Machine account lockout threshold is set to 10
    or fewer invalid logon attempts, but not 0.'
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System
    name: MaxDevicePasswordFailedAttempts
    value: 10
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System'
      /v MaxDevicePasswordFailedAttempts /t REG_DWORD /d 10 /f
- id: 2.3.7.4
  title: Ensure Interactive logon Machine inactivity limit is set to 900 or fewer
    seconds but not 0.
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows\Currentversion\Policies\System
    name: InactivityTimeoutSecs
    value: 900
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows\Currentversion\Policies\System'
      /v InactivityTimeoutSecs /t REG_DWORD /d 900 /f
- id: 2.3.7.5
  title: Configure Interactive logon Message title for users attempting to log on.
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows\Currentversion\Policies\System
    name: LegalNoticeText
    value: 'You are accessing a U.S. Government (USG) Information System (IS) that
      is provided for USG-authorized use only.


      By using this IS (which includes any device attached to this IS), you consent
      to the following conditions:


      -The USG routinely intercepts and monitors communications on this IS for purposes
      including, but not limited to, penetration testing, COMSEC monitoring, network
      operations and defense, personnel misconduct (PM), law enforcement (LE), and
      counterintelligence (CI) investigations.


      -At any time, the USG may inspect and seize data stored on this IS.


      -Communications using, or data stored on, this IS are not private, are subject
      to routine monitoring, interception, and search, and may be disclosed or used
      for any USG-authorized purpose.


      -This IS includes security measures (e.g., authentication and access controls)
      to protect USG interests--not for your personal benefit or privacy.


      -Notwithstanding the above, using this IS does not constitute consent to PM,
      LE or CI investigative searching or monitoring of the content of privileged
      communications, or work product, related to personal representation or services
      by attorneys, psychotherapists, or clergy, and their assistants. Such communications
      and work product are private and confidential. See User Agreement for details.

      '
  remediation:
    powershell: "reg add 'HKLM\\Software\\Microsoft\\Windows\\Currentversion\\Policies\\\
      System' /v LegalNoticeText /t REG_SZ /d You are accessing a U.S. Government\
      \ (USG) Information System (IS) that is provided for USG-authorized use only.\n\
      \nBy using this IS (which includes any device attached to this IS), you consent\
      \ to the following conditions:\n\n-The USG routinely intercepts and monitors\
      \ communications on this IS for purposes including, but not limited to, penetration\
      \ testing, COMSEC monitoring, network operations and defense, personnel misconduct\
      \ (PM), law enforcement (LE), and counterintelligence (CI) investigations.\n\
      \n-At any time, the USG may inspect and seize data stored on this IS.\n\n-Communications\
      \ using, or data stored on, this IS are not private, are subject to routine\
      \ monitoring, interception, and search, and may be disclosed or used for any\
      \ USG-authorized purpose.\n\n-This IS includes security measures (e.g., authentication\
      \ and access controls) to protect USG interests--not for your personal benefit\
      \ or privacy.\n\n-Notwithstanding the above, using this IS does not constitute\
      \ consent to PM, LE or CI investigative searching or monitoring of the content\
      \ of privileged communications, or work product, related to personal representation\
      \ or services by attorneys, psychotherapists, or clergy, and their assistants.\
      \ Such communications and work product are private and confidential. See User\
      \ Agreement for details.\n /f"
- id: 2.3.7.6
  title: Configure Interactive logon Message title for users attempting to log on.
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows\Currentversion\Policies\System
    name: LegalNoticeCaption
    value: DoD Notice and Consent Banner
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows\Currentversion\Policies\System'
      /v LegalNoticeCaption /t REG_SZ /d DoD Notice and Consent Banner /f
- id: 2.3.7.7
  title: 'Ensure ''Interactive logon: Number of previous logons to cache (in case
    domain controller is not available)'' is set to ''4 or fewer logon(s)'
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon
    name: CachedLogonsCount
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon'
      /v CachedLogonsCount /t REG_SZ /d 1 /f
- id: 2.3.7.8
  title: Ensure Interactive logon Prompt user to change password before expiration
    is set to between 5 and 14 days
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon
    name: PasswordExpiryWarning
    value: 14
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon'
      /v PasswordExpiryWarning /t REG_DWORD /d 14 /f
- id: 2.3.7.9
  title: Ensure Interactive logon Smart card removal behavior is set to Lock Workstation
    or higher
  section: '2'
  severity: medium
  level: 1
  profile: ''
  check:
    type: registry
    key: HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon
    name: ScRemoveOption
    value: 1
  remediation:
    powershell: reg add 'HKLM\Software\Microsoft\Windows Nt\Currentversion\Winlogon'
